name: AgentSoul CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install --upgrade pip pytest && python -m pip install .
      - name: Run AgentSoul tests
        run: >-
          python -m pytest -q
          tests/test_core.py
          tests/test_project_and_migration.py
          tests/test_knowledge.py
          tests/test_retrieval.py
          tests/test_session.py
          tests/test_hybrid.py
          tests/test_mcp_server.py
          tests/test_web_ui.py
      - name: CLI smoke test
        run: python -m agentsoul_core.cli --home .tmp-agentsoul init
      - name: Web and MCP import smoke test
        run: python -c "from agentsoul_mcp.server import app; from agentsoul_web.app import INDEX; print(app, len(INDEX))"
