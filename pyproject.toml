[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsoul"
version = "0.3.0"
description = "Provider-neutral cognitive memory runtime for AI agents and ChatGPT"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AgentSoul contributors"}]
dependencies = [
  "mcp>=1.27,<2",
  "uvicorn>=0.30,<1",
]

[project.scripts]
agentsoul = "agentsoul_core.cli:main"
agentsoul-mcp = "agentsoul_mcp.server:main"

[tool.setuptools]
packages = ["agentsoul_core", "agentsoul_mcp", "agentsoul_web"]
